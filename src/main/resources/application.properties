spring.application.name=alumni-searcher

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/freightfox_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# PhantomBuster API configuration
phantombuster.api.base-url=https://api.phantombuster.com/api/v2
phantombuster.api.key=${PHANTOMBUSTER_API_KEY}
phantombuster.agent-id=${PHANTOMBUSTER_AGENT_ID}

phantombuster.execution.max-attempts=90
phantombuster.execution.poll-interval-ms=10000