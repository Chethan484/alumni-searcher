
spring.application.name=alumni-searcher

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/freightfox_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${PORT:8080}

# PhantomBuster API Configuration
phantombuster.api.base-url=https://api.phantombuster.com/api/v2
phantombuster.api.key=${PHANTOMBUSTER_API_KEY}
phantombuster.agent-id=${PHANTOMBUSTER_AGENT_ID}

# PhantomBuster Execution Configuration
phantombuster.execution.max-attempts=90
phantombuster.execution.poll-interval-ms=10000
